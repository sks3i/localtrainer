# DPO example: preference alignment of LLaMA-3.1-8B on UltraFeedback
# Run with: train configs/dpo_example.yaml

trainer_type: dpo
run_name: llama3-dpo-ultrafeedback
output_dir: outputs/llama3-dpo-ultrafeedback
wandb_project: train_utils
wandb_entity: null  # set to your wandb username/team or leave null for default

model:
  model_id: unsloth/Meta-Llama-3.1-8B-Instruct
  use_unsloth: true
  max_seq_length: 1024
  dtype: null
  attn_implementation: flash_attention_2
  trust_remote_code: false
  lora:
    use_lora: true
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    bias: none
    use_rslora: false
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
  quantization:
    load_in_4bit: true
    bnb_4bit_quant_type: nf4
    bnb_4bit_compute_dtype: bfloat16
    bnb_4bit_use_double_quant: true

dpo:
  dataset_id: trl-lib/ultrafeedback_binarized
  dataset_split: train
  eval_dataset_split: test
  beta: 0.1
  loss_type: sigmoid        # options: sigmoid | hinge | ipo | kto_pair
  reference_model_id: null  # null = TRL creates ref copy from policy (recommended with LoRA)
  label_smoothing: 0.0
  max_prompt_length: 512
  max_length: 1024
  max_num_samples: null

training:
  num_train_epochs: 1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 5.0e-5
  lr_scheduler_type: cosine
  warmup_ratio: 0.1
  weight_decay: 0.01
  max_grad_norm: 1.0
  logging_steps: 10
  save_steps: 200
  eval_steps: 200
  save_total_limit: 2
  seed: 42
  bf16: true
  fp16: false
  gradient_checkpointing: true
  torch_compile: false
  dataloader_num_workers: 4
  report_to: wandb
